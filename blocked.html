<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Blocked</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }
    
    /* Animated background circles */
    .bg-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      animation: float 20s infinite;
    }
    
    .bg-circle:nth-child(1) {
      width: 300px;
      height: 300px;
      top: -150px;
      left: -150px;
      animation-delay: 0s;
    }
    
    .bg-circle:nth-child(2) {
      width: 200px;
      height: 200px;
      bottom: -100px;
      right: -100px;
      animation-delay: 7s;
    }
    
    .bg-circle:nth-child(3) {
      width: 150px;
      height: 150px;
      top: 50%;
      left: 10%;
      animation-delay: 14s;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.1); }
    }
    
    .container {
      background: white;
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 70px rgba(0,0,0,0.3);
      position: relative;
      z-index: 1;
      animation: slideUp 0.5s ease-out;
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .icon-container {
      width: 100px;
      height: 100px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    .icon {
      font-size: 50px;
    }
    
    h1 {
      font-size: 28px;
      color: #1f2937;
      margin-bottom: 12px;
      font-weight: 700;
    }
    
    .subtitle {
      font-size: 16px;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 24px;
      font-weight: 500;
    }
    
    .reason-box {
      background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 14px;
      color: #374151;
      margin-bottom: 24px;
      border-left: 4px solid #667eea;
      text-align: left;
      font-weight: 500;
      line-height: 1.6;
    }
    
    .timer-container {
      margin: 24px 0;
    }
    
    .timer-label {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .timer {
      font-size: 48px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
    }
    
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 24px;
    }
    
    .btn {
      padding: 14px 28px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      flex: 1;
      min-width: 140px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 14px rgba(102, 126, 234, 0.4);
    }
    
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.5);
    }
    
    .btn-primary:active {
      transform: translateY(-1px);
    }
    
    .motivational-quote {
      margin-top: 24px;
      padding: 16px 20px;
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
      border-radius: 14px;
      font-size: 14px;
      color: #92400e;
      font-weight: 600;
      font-style: italic;
      line-height: 1.6;
    }
    
    .quote-icon {
      font-size: 22px;
      margin-bottom: 6px;
    }
    
    /* Tablet styles */
    @media (max-width: 768px) {
      body {
        padding: 12px;
      }
      
      .container {
        padding: 32px 24px;
        border-radius: 20px;
      }
      
      .icon-container {
        width: 90px;
        height: 90px;
      }
      
      .icon {
        font-size: 45px;
      }
      
      h1 {
        font-size: 24px;
      }
      
      .subtitle {
        font-size: 15px;
      }
      
      .reason-box {
        padding: 14px 16px;
        font-size: 13px;
      }
      
      .timer {
        font-size: 42px;
      }
      
      .btn {
        padding: 12px 24px;
        font-size: 14px;
        min-width: 120px;
      }
      
      .motivational-quote {
        font-size: 13px;
        padding: 14px 16px;
      }
    }
    
    /* Mobile styles */
    @media (max-width: 480px) {
      body {
        padding: 10px;
      }
      
      .bg-circle {
        display: none; /* Hide animated circles on mobile for performance */
      }
      
      .container {
        padding: 28px 20px;
        border-radius: 18px;
      }
      
      .icon-container {
        width: 80px;
        height: 80px;
        margin-bottom: 20px;
      }
      
      .icon {
        font-size: 40px;
      }
      
      h1 {
        font-size: 22px;
        margin-bottom: 10px;
      }
      
      .subtitle {
        font-size: 14px;
        margin-bottom: 20px;
      }
      
      .reason-box {
        padding: 12px 14px;
        font-size: 12px;
        margin-bottom: 20px;
        border-radius: 12px;
      }
      
      .timer-container {
        margin: 20px 0;
      }
      
      .timer-label {
        font-size: 12px;
        margin-bottom: 8px;
      }
      
      .timer {
        font-size: 36px;
        letter-spacing: 1px;
      }
      
      .buttons {
        flex-direction: column;
        gap: 10px;
      }
      
      .btn {
        width: 100%;
        padding: 12px 20px;
        font-size: 14px;
        min-width: unset;
      }
      
      .motivational-quote {
        font-size: 12px;
        padding: 12px 14px;
        margin-top: 20px;
        border-radius: 12px;
      }
      
      .quote-icon {
        font-size: 20px;
        margin-bottom: 4px;
      }
    }
    
    /* Extra small mobile */
    @media (max-width: 360px) {
      .container {
        padding: 24px 16px;
      }
      
      h1 {
        font-size: 20px;
      }
      
      .subtitle {
        font-size: 13px;
      }
      
      .timer {
        font-size: 32px;
      }
      
      .btn {
        padding: 11px 18px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-circle"></div>
  <div class="bg-circle"></div>
  <div class="bg-circle"></div>
  
  <div class="container">
    <div class="icon-container">
      <div class="icon">🚫</div>
    </div>
    
    <h1>Website Blocked</h1>
    <p class="subtitle" id="message">This website has been blocked by Focus Timer & Blocker.</p>
    
    <div class="reason-box" id="reason"></div>
    
    <div class="timer-container" id="timerContainer" style="display: none;">
      <div class="timer-label">Time Remaining</div>
      <div class="timer" id="timer">00:00</div>
    </div>
    
    <div class="motivational-quote" id="quote" style="display: none;">
      <div class="quote-icon">💡</div>
      <div id="quoteText"></div>
    </div>
    
    <div class="buttons">
      <button class="btn btn-primary" id="goBackBtn">
        <span>←</span> Go Back
      </button>
    </div>
  </div>
  
  <script src="blocked.js"></script>
</body>
</html>
